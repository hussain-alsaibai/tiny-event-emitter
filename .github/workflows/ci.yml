name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No file list: pytest collects every test_*.py, so a new test file is
      # never silently skipped. The previous command named test_*.py, which
      # misses tests/ entirely.
      - run: python -m pytest -q
